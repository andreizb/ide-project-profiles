name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cursor-and-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cursor/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run typecheck && npm run build && npm test
        working-directory: cursor
      - run: bash -n install.sh && python3 -m py_compile manage.py build.py run_tests.py cursor/pack.py cursor/verify_host.py
